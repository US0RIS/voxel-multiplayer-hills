name: Validate voxel building and mining

on:
  push:
    branches:
      - feature/cursor-building-chunk-tools-v0.5.1
      - feature/terrain-mining-collision-v0.6.0
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate persistent server runtime
        run: python3 tools/validate-persistent-world.py
      - name: Validate browser source syntax
        run: |
          node --check docs/game-loader-v4.3.0.js
          node --check docs/game-loader-v0.6.0.js
          node --check docs/auth-v0.5.0.js
          node --check docs/home-v0.5.0.js
          node --check docs/chunk-claim-borders-v0.5.3.js
          node --check docs/chat-world-commands-v0.5.2.js
      - name: Apply base loader patches and validate generated renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader = Path('docs/game-loader-v4.3.0.js').read_text()
          renderer = Path('docs/multiplayer-hills-v4.1.0.js').read_text()
          pattern = re.compile(
              r"source = replaceRequired\(\s*source,\s*(`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*'),\s*(`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*'),\s*'([^']+)'\s*\);",
              re.S,
          )

          def decode_js(value):
              text = value[1:-1]
              out = []
              i = 0
              escapes = {'n': '\n', 'r': '\r', 't': '\t', 'b': '\b', 'f': '\f', 'v': '\v'}
              while i < len(text):
                  char = text[i]
                  if char != '\\' or i + 1 >= len(text):
                      out.append(char)
                      i += 1
                      continue
                  next_char = text[i + 1]
                  out.append(escapes.get(next_char, next_char))
                  i += 2
              return ''.join(out)

          count = 0
          for match in pattern.finditer(loader):
              search = decode_js(match.group(1))
              replacement = decode_js(match.group(2))
              label = match.group(3)
              if search not in renderer:
                  raise SystemExit(f'Missing renderer patch target: {label}')
              renderer = renderer.replace(search, replacement, 1)
              count += 1
          if count < 10:
              raise SystemExit(f'Only applied {count} renderer patches')
          Path('/tmp/ridgewood-generated.mjs').write_text(renderer)
          print(f'Applied {count} base renderer patches')
          PY
          node --check /tmp/ridgewood-generated.mjs
      - name: Confirm mining and collision features
        run: |
          grep -q "function raycastWorld" docs/game-loader-v4.3.0.js
          grep -q "function reconcileWorldVoxels" docs/game-loader-v0.6.0.js
          grep -q "function canOccupyPlayerAt" docs/game-loader-v0.6.0.js
          grep -q "kind: 'terrain'" docs/game-loader-v0.6.0.js
          grep -q "voxel player collision" docs/game-loader-v0.6.0.js
          grep -q "bedrock" server/world_persistence.py
          grep -q "intersects_player" server/world_persistence.py
          grep -q "jsonb_build_object('action', 'remove')" SUPABASE_MIGRATION_003_TERRAIN_MINING.sql
          ! grep -q "voxel_data = coalesce(voxel_data, '{}'::jsonb) - v_key" SUPABASE_MIGRATION_003_TERRAIN_MINING.sql
