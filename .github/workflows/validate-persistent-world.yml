name: Validate Ridgewood runtime

on:
  push:
    branches:
      - feature/market-street-glb-v0.9.1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python runtime patches and migration markers
        run: python3 tools/validate-persistent-world.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check docs/game-loader-v4.3.0.js
          node --check docs/game-loader-v0.6.0.js
          node --check docs/game-loader-v0.8.0-base.js
          node --check docs/game-loader-v0.8.0.js
          node --check docs/game-loader-v0.9.0.js
          node --check docs/game-loader-v0.9.1.js
          node --check docs/marketplace-v0.9.0.js
          node --check docs/marketplace-v0.9.1.js
          node --check docs/assets/market-stall-v0.9.1.js
          node --check docs/auth-v0.5.0.js
          node --check docs/admin-v0.8.0.js
      - name: Resolve complete market street loader chain
        run: node tests/loader-chain-test.mjs
      - name: Confirm checkout remains clean
        run: git diff --exit-code
      - name: Package complete source tree
        run: |
          mkdir -p package/voxel-multiplayer-hills-v0.9.1-alpha
          git archive HEAD | tar -x -C package/voxel-multiplayer-hills-v0.9.1-alpha
      - name: Upload complete repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: voxel-multiplayer-hills-v0.9.1-alpha
          path: package/voxel-multiplayer-hills-v0.9.1-alpha
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
