name: Move chat-parts into docs

on:
  push:
    branches:
      - move-chat-parts-into-docs

permissions:
  contents: write

jobs:
  move-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: move-chat-parts-into-docs
          fetch-depth: 0

      - name: Move folder without changing file contents
        shell: bash
        run: |
          set -euo pipefail
          test -d chat-parts
          test ! -e docs/chat-parts
          git mv chat-parts docs/chat-parts
          git rm .github/workflows/move-chat-parts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move chat-parts into docs"
          git push origin HEAD:move-chat-parts-into-docs
