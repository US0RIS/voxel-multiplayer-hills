name: Validate username password authentication

on:
  push:
    branches:
      - feature/username-password-auth-v0.7.0
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile authentication server
        run: |
          python3 -m py_compile server/auth_supabase.py server/password_auth.py server/supabase_store.py
          python3 tools/validate-persistent-world.py
      - name: Validate browser authentication
        run: |
          node --check docs/auth-v0.5.0.js
          grep -q "/auth/password/register" server/auth_supabase.py
          grep -q "/auth/password/login" server/auth_supabase.py
          grep -q "hashlib.scrypt" server/password_auth.py
          grep -q "hmac.compare_digest" server/password_auth.py
          grep -q "game_password_credentials" SUPABASE_MIGRATION_004_PASSWORD_AUTH.sql
          grep -q "data-login-chooser" docs/index.html
          grep -q "Username & password" docs/auth-v0.5.0.js
          # Assert the auth script is cache-busted, without pinning the version:
          # the query string has to change on every release, so pinning it here
          # turns a correct cache-bust into a CI failure.
          grep -qE 'auth-v0\.5\.0\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' docs/index.html
      - name: Confirm no password material reaches browser storage
        run: |
          ! grep -R "password_hash\|password_salt" docs
