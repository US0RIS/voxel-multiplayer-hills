name: Validate admin roles

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile server modules and apply every runtime patch
        run: python3 tools/validate-persistent-world.py

      - name: Staff permission regression suite
        run: python3 tests/admin-permissions-test.py

      - name: Validate browser syntax
        run: |
          node --check docs/admin-v0.8.0.js
          node --check docs/auth-v0.5.0.js
          node --check docs/game-loader-v0.6.0.js
          node --check docs/game-loader-v4.3.0.js
          node --check docs/chat-source-v4.3.0.js

      - name: Resolve the full loader chain and confirm the game is patched
        run: node tests/loader-chain-test.mjs

      - name: Chat prominence DOM suite
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node tests/chat-badge-test.mjs

      - name: Confirm staff badges live outside the chat module
        run: |
          # Badges are applied by admin-v0.8.0.js against the rendered DOM, so
          # the chat client and its generated parts stay untouched. If this ever
          # moves back into the chat source, the parts must be rebuilt — and the
          # parts are currently ahead of the source. See tools/reconcile-chat-parts.py.
          grep -q "chat prominence" docs/admin-v0.8.0.js
          grep -q "chat-role-badge" docs/admin-v0.8.0.js
          ! grep -q "chat-role-badge" docs/chat-source-v4.3.0.js

      - name: Confirm the client holds no authority
        run: |
          # The panel must never decide permissions locally: every power has to
          # come from the server's welcome packet.
          grep -q "message.admin" docs/admin-v0.8.0.js
          grep -q "admin:action" docs/admin-v0.8.0.js
          # And the server must gate every admin action on the stored role.
          grep -q "if not admin.client_is_staff(client):" server/admin_runtime_patch.py
          grep -q "def require_staff" server/admin.py
          grep -q "is_staff_user" SUPABASE_MIGRATION_005_ADMIN_ROLES.sql

      - name: Confirm no secrets reach the browser
        run: |
          ! grep -R "password_hash\|password_salt\|SUPABASE_SECRET\|SERVICE_ROLE" docs

      - name: Confirm generated artefacts are committed
        run: git diff --exit-code
