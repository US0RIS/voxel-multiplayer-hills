services:
  - type: web
    name: voxel-multiplayer-hills-410-server
    runtime: python
    plan: free
    rootDir: server
    autoDeployTrigger: off
    buildCommand: echo "No build step required"
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: WORLD_SEED
        value: "4102026"
      - key: MAX_PLAYERS
        value: "8"
      - key: GAME_URL
        value: "https://us0ris.github.io/voxel-multiplayer-hills/"
      - key: SERVER_URL
        value: "https://voxel-multiplayer-hills-410-server.onrender.com"
      - key: DISCORD_REDIRECT_URI
        value: "https://voxel-multiplayer-hills-410-server.onrender.com/auth/discord/callback"
      - key: AUTH_REQUIRED
        value: "1"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
