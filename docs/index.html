<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Voxel Multiplayer Hills v4.2.0 social chat build" />
  <title>Voxel Multiplayer Hills — v4.2.0 Chat</title>
  <link rel="stylesheet" href="styles.css?v=4.2.0" />
</head>
<body>
  <main id="game" aria-label="Voxel multiplayer rolling hills version 4.2.0">
    <canvas id="canvas" tabindex="0"></canvas>
  </main>

  <aside id="chat-panel" data-collapsed="false" aria-label="World group chat">
    <header class="chat-header">
      <button id="chat-collapse" class="icon-button chat-collapse" type="button" aria-label="Collapse chat" title="Collapse chat">
        <span aria-hidden="true">‹</span>
      </button>
      <div class="chat-title-block">
        <strong>World chat</strong>
        <span id="chat-connection" data-state="connecting">Connecting…</span>
      </div>
      <div class="chat-header-actions">
        <button id="chat-search-toggle" class="icon-button" type="button" aria-label="Search messages" title="Search messages (Ctrl+F)">⌕</button>
        <button id="chat-sound-toggle" class="icon-button" type="button" aria-label="Toggle notification sound" aria-pressed="true">🔔</button>
      </div>
    </header>

    <div id="chat-search-bar" class="chat-search" hidden>
      <input id="chat-search-input" type="search" autocomplete="off" placeholder="Search messages…" aria-label="Search chat messages" />
      <button id="chat-search-close" class="icon-button" type="button" aria-label="Close search">×</button>
    </div>

    <div class="chat-main">
      <section class="chat-conversation" aria-label="Message history">
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div id="chat-typing" class="chat-typing" aria-live="polite"></div>

        <div id="chat-context" class="chat-context" hidden>
          <div class="chat-context-header">
            <strong id="chat-context-title">Message</strong>
            <button id="chat-context-close" class="icon-button" type="button" aria-label="Close message actions">×</button>
          </div>
          <button id="chat-context-location" class="context-location" type="button" hidden></button>
          <div id="chat-context-reactions" class="context-reactions" aria-label="Add reaction"></div>
        </div>

        <div id="chat-mention-menu" class="chat-suggestion-menu" hidden></div>
        <div id="chat-command-hint" class="chat-suggestion-menu chat-command-menu" hidden></div>

        <footer class="chat-composer">
          <div class="composer-input-wrap">
            <textarea id="chat-input" rows="1" maxlength="500" autocomplete="off" spellcheck="true" placeholder="Connecting chat…" aria-label="Chat message"></textarea>
            <span id="chat-char-count">0/500</span>
          </div>
          <button id="chat-send" type="button" disabled>Send</button>
        </footer>
      </section>

      <aside class="chat-players" aria-label="Players">
        <div class="players-heading">
          <strong>Players</strong>
          <span id="chat-online-count">0 online</span>
        </div>
        <div id="chat-player-list" class="chat-player-list"></div>
        <div class="status-editor">
          <label for="chat-status-input">Your status</label>
          <div>
            <input id="chat-status-input" type="text" maxlength="80" autocomplete="off" placeholder="AFK, building, studying…" />
            <button id="chat-status-save" type="button">Set</button>
          </div>
        </div>
      </aside>
    </div>
  </aside>

  <button id="chat-collapsed-tab" type="button" aria-label="Expand world chat" hidden>
    <span class="chat-tab-icon" aria-hidden="true">◈</span>
    <span id="chat-unread" class="chat-unread" hidden>0</span>
  </button>

  <section id="chat-toasts" class="chat-toasts" aria-label="Chat notifications" aria-live="polite"></section>

  <div id="loading" role="status">
    <div class="loader"></div>
    <div id="loading-text">Starting…</div>
  </div>

  <div id="build-badge" aria-live="polite">
    <strong>MULTIPLAYER HILLS · v4.2.0</strong>
    <span id="network-label">connecting…</span>
    <span id="player-label">players loading…</span>
    <span id="seed-label">seed loading…</span>
    <span id="chunk-label">chunk loading…</span>
  </div>

  <div id="help" aria-hidden="true">
    <span><kbd>WASD</kbd> / <kbd>Arrows</kbd> move</span>
    <span><kbd>Enter</kbd> chat</span>
    <span><kbd>Scroll</kbd> zoom</span>
    <span><kbd>Ctrl/⌘ F</kbd> search</span>
  </div>

  <div id="error" hidden>
    <strong>Unable to start the prototype.</strong>
    <span id="error-message"></span>
  </div>

  <script src="config.js?v=4.2.0"></script>
  <script src="chat-v4.2.0.js?v=4.2.0"></script>
  <script type="module" src="game-loader-v4.2.0.js?v=4.2.0"></script>
</body>
</html>
